title = "REPO-NAME"

[extend]
useDefault = true

# 历史已提交的秘密按精确值放行（regexTarget=line 匹配整行，值不变即豁免）。
# 只放已经入库的既定事实；新值仍会命中规则。不要用 paths 整文件放行。
