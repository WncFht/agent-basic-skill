repos:
  # 顺序即语义：原地改写型 fixer（markdownlint --fix）在前，改了就 fail 一次
  # 让你 re-add；git-format-staged 链式 formatter 只写 index 收尾——commit
  # 永远成功，混合暂存时未暂存的编辑不受污染。
  # prettier / markdownlint-cli2 / gfs 版本以 package.json 为唯一事实源；
  # autocorrect 等系统工具走 brew。
  #
  # 本文件是通用 base：每个仓库都有 markdown + yaml + gitleaks。
  # 其他文件类型的 hook 块按 census 结果从 skill 的 references/recipes.md
  # 逐卡追加到下面的 hooks: 列表（缩进与现有条目一致）。
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 --fix
        entry: ./node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]
      # ⚠ CJK 文档仓走另一支 md 链（recipes.md 首卡「markdown CJK 表格变
      # 体」）：prettier 按字符宽补白与 MD060 的显示宽度判定（CJK=2）互斥
      # 会乒乓——变体把本钩换成 scripts/md_table_align.py 原地 fixer +
      # autocorrect-only，并同步划出 package.json format glob 的
      # **/*.md 与 .vscode 的 md formatter。
      - id: prettier-md
        name: autocorrect + prettier (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "autocorrect --stdin | ./node_modules/.bin/prettier --stdin-filepath {}"
        language: system
        types: [markdown]
      - id: prettier-yaml
        name: prettier (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "./node_modules/.bin/prettier --stdin-filepath {}"
        language: system
        types: [yaml]
      # yaml 散文注释 ≤80 显示列（CJK 按 2 列计——yamllint 只数字符所以
      # 自写）。check 类、失败才拦；断点该落标点/从句边界是语义判断，
      # 机检只管宽度，断点靠人工（机械重排用编辑器 reflow）。
      - id: yaml-comment-width
        name: yaml comment width (display cols)
        entry: python3 scripts/check-yaml-comments.py
        language: system
        types: [yaml]
  # secret 门控：默认规则 + .gitleaks.toml 自定义（本仓自有凭据格式、
  # 历史已提交值的精确放行）。GitHub push protection 只认标准 pattern，
  # 自有格式靠这里的自定义规则拦。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
