# asr 外部依赖 — skill-management/scripts/skill_deps.py 消费。
# GPU 检查按平台匹配二进制与解释器，避免把其他平台的残留工件误判为可用。

[[dep]]
name = "asr-venv"
check = "test -x ~/.agents/skills/asr/.venv/bin/python"
install = "bash ~/.agents/skills/asr/scripts/setup.sh"
upgrade = "bash ~/.agents/skills/asr/scripts/setup.sh"

[[dep]]
name = "asr-models"
check = "test -d ~/.agents/skills/asr/models/silero-vad-v5"
install = "bash ~/.agents/skills/asr/scripts/setup.sh"

[[dep]]
name = "ffmpeg"
check = "command -v ffmpeg"
optional = true   # 只有非 PCM16 wav 输入才需要
install = { linux = "sudo pacman -S --needed ffmpeg", darwin = "brew install ffmpeg" }

[[dep]]
name = "asr-gpu-en"
check = { linux = 'compgen -G "$HOME/.agents/skills/asr/bin/parakeet-*-linux-*/parakeet-cli" >/dev/null', darwin = 'compgen -G "$HOME/.agents/skills/asr/bin/parakeet-*-macos-*/parakeet-cli" >/dev/null' }
optional = true   # EN GPU 档：Linux CUDA / macOS Metal
install = "bash ~/.agents/skills/asr/scripts/setup.sh --gpu en"
upgrade = "bash ~/.agents/skills/asr/scripts/setup.sh --gpu en"

[[dep]]
name = "asr-gpu-zh"
check = { linux = "test -x $HOME/.agents/skills/asr/.venv-qwen/bin/python", darwin = "test -x $HOME/.agents/skills/asr/.venv-mlx/bin/python" }
optional = true
install = "bash ~/.agents/skills/asr/scripts/setup.sh --gpu zh"
